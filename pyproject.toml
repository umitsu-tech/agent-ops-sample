[project]
name = "support-agent"
version = "0.1.0"
description = "問い合わせ対応エージェント（技術同人誌の運用・評価の章のサンプル）"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[otel]>=1.56.0",
    "strands-agents-tools>=0.2.0",
    "langfuse>=3.0.0",
    "python-dotenv>=1.0.0",
    "botocore[crt]>=1.43.98",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]
